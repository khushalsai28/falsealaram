<meta charset="utf-8">
<style>
  :root{color:#172033;background:#fff;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  body{width:300px;margin:0;padding:14px;box-sizing:border-box}
  h1{font-size:16px;margin:0 0 12px;color:#4338ca}.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
  button{width:100%;padding:8px 10px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font:inherit;font-weight:650;cursor:pointer}

  small{color:#6b7280;display:block;margin-top:12px}

<h1>FalseAlarm</h1>
<div class="row"><label for="enabled">Highlight checks</label><input type="checkbox" id="enabled"></div>
<button id="scan">Scan this page</button>

<div id="status" role="status">Loading…</div>
<hr class="divider">
<label for="query">Ask the research agent</label>
